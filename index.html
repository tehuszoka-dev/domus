<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOMUS | Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/state.js"></script>
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-header">
            <div class="brand-logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <h1>DOMUS</h1>
            </div>
            <span>SMART HOME CONTROL</span>
            <p class="brand-tagline">Tecnologia que entende o seu jeito de viver.</p>
        </div>

        <form id="loginForm" onsubmit="realizarLogin(event)" class="login-form">
            <div class="input-group">
                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" placeholder="Digite seu usuário" required autocomplete="off">
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required>
            </div>

            <div id="loginError" class="login-error" style="display: none; color: #ef4444; margin-bottom: 15px; text-align: center; font-size: 0.9rem;">
                Usuário ou senha incorretos.
            </div>

            <button type="submit" class="login-button">Entrar no Sistema</button>

            <div class="oauth-divider">
                <span>ou continue com</span>
            </div>

            <div class="oauth-buttons">
                <button type="button" class="btn-oauth" onclick="alert('Integração com Google em breve!')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 15.9 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/></svg>
                    Google
                </button>
                <button type="button" class="btn-oauth" onclick="alert('Integração com Apple em breve!')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.85c.66-.8 1.11-1.92.99-3.04-.96.04-2.12.64-2.8 1.44-.61.71-1.15 1.86-.99 2.96 1.07.08 2.14-.56 2.8-1.36z"/></svg>
                    Apple
                </button>
                <button type="button" class="btn-oauth" onclick="alert('Integração com Microsoft em breve!')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M11.4 24H0V12.6h11.4V24zM24 24H12.6V12.6H24V24zM11.4 11.4H0V0h11.4v11.4zm12.6 0H12.6V0H24v11.4z"/></svg>
                    Microsoft
                </button>
            </div>

            <p class="auth-toggle" style="margin-top: 20px; text-align: center; color: #94a3b8; font-size: 0.9rem;">
                Não possui uma conta? <a href="cadastro.html" style="color: #0ea5e9; text-decoration: none; font-weight: 600;">Cadastre-se</a>
            </p>
        </form>
    </div>

    <script src="script.js"></script>
    <script>
        function realizarLogin(event) {
            event.preventDefault();
            const u = document.getElementById("usuario").value;
            const s = document.getElementById("senha").value;
            const errorDiv = document.getElementById("loginError");

            if (AppState.login(u, s)) {
                window.location.href = "pages/dashboard.html";
            } else {
                errorDiv.style.display = "block";
            }
        }
    </script>
</body>
</html>
